name: CI

on:
  push:
    branches: ["master", "main", "feature/**"]
  pull_request:
    branches: ["master", "main"]

jobs:
  decision-science:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q ai_data_science_team
      - name: Decision-science tests
        run: pytest tests
      - name: Lint decision-science core
        run: ruff check ai_data_science_team/decision_science tests
